<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <rect width="1800" height="1200" fill="#f5f7fb"/>
  <text x="40" y="48" font-size="30" font-family="Microsoft YaHei, sans-serif" font-weight="700" fill="#172033">SSD 日志页面：布局与组件使用标注</text>
  <text x="40" y="82" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#64748b">真实 MasterGo 页面 1280×1024 · 图层 962:229768 · 左侧为页面示意，右侧为设计指定</text>

  <!-- page mockup -->
  <rect x="40" y="120" width="1120" height="980" rx="12" fill="#ffffff" stroke="#334155" stroke-width="3"/>
  <rect x="40" y="120" width="1120" height="116" rx="12" fill="#eaf0f8" stroke="#94a3b8"/>
  <text x="70" y="155" font-size="18" font-family="Microsoft YaHei, sans-serif" font-weight="700" fill="#1e293b">顶部设备 / 安全区</text>
  <rect x="70" y="170" width="92" height="48" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="116" y="201" text-anchor="middle" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#991b1b">急停</text>
  <rect x="820" y="170" width="104" height="48" rx="8" fill="#e2e8f0" stroke="#64748b"/>
  <text x="872" y="201" text-anchor="middle" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#334155">传感器</text>
  <rect x="936" y="170" width="104" height="48" rx="8" fill="#e2e8f0" stroke="#64748b"/>
  <text x="988" y="201" text-anchor="middle" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#334155">终端</text>
  <rect x="1052" y="170" width="82" height="48" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="1093" y="201" text-anchor="middle" font-size="14" font-family="Microsoft YaHei, sans-serif" fill="#92400e">报警/解除</text>

  <!-- left navigation -->
  <rect x="60" y="258" width="190" height="630" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="80" y="292" font-size="18" font-family="Microsoft YaHei, sans-serif" font-weight="700" fill="#334155">左侧模块导航区</text>
  <rect x="78" y="316" width="154" height="42" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="155" y="343" text-anchor="middle" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#1d4ed8">主日志</text>
  <rect x="78" y="368" width="154" height="42" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="155" y="395" text-anchor="middle" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#475569">报警日志</text>
  <text x="80" y="448" font-size="15" font-family="Microsoft YaHei, sans-serif" fill="#64748b">模块列表</text>
  <rect x="78" y="468" width="154" height="40" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="155" y="494" text-anchor="middle" font-size="15" font-family="Microsoft YaHei, sans-serif" fill="#334155">全部</text>
  <rect x="78" y="520" width="154" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="155" y="546" text-anchor="middle" font-size="15" font-family="Microsoft YaHei, sans-serif" fill="#64748b">模块 A</text>
  <rect x="78" y="572" width="154" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="155" y="598" text-anchor="middle" font-size="15" font-family="Microsoft YaHei, sans-serif" fill="#64748b">模块 B</text>

  <!-- center table -->
  <rect x="270" y="258" width="610" height="630" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="292" y="292" font-size="18" font-family="Microsoft YaHei, sans-serif" font-weight="700" fill="#334155">中央日志表格区</text>
  <rect x="292" y="316" width="112" height="38" rx="5" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="348" y="341" text-anchor="middle" font-size="14" font-family="Microsoft YaHei, sans-serif" fill="#1d4ed8">维度</text>
  <rect x="414" y="316" width="112" height="38" rx="5" fill="#ffffff" stroke="#94a3b8"/>
  <text x="470" y="341" text-anchor="middle" font-size="14" font-family="Microsoft YaHei, sans-serif" fill="#475569">时间</text>
  <rect x="292" y="370" width="566" height="38" fill="#e2e8f0"/>
  <text x="310" y="395" font-size="14" font-family="Microsoft YaHei, sans-serif" fill="#334155">序号</text>
  <text x="380" y="395" font-size="14" font-family="Microsoft YaHei, sans-serif" fill="#334155">时间</text>
  <text x="545" y="395" font-size="14" font-family="Microsoft YaHei, sans-serif" fill="#334155">事件ID</text>
  <text x="700" y="395" font-size="14" font-family="Microsoft YaHei, sans-serif" fill="#334155">事件数据</text>
  <g font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#475569">
    <rect x="292" y="410" width="566" height="38" fill="#ffffff" stroke="#e2e8f0"/><text x="310" y="435">01</text><text x="380" y="435">2026/03/09 12:00</text><text x="545" y="435">MACHINE.DAT.OK</text><text x="700" y="435">全自动运行启动</text>
    <rect x="292" y="448" width="566" height="38" fill="#f8fafc" stroke="#e2e8f0"/><text x="310" y="473">02</text><text x="380" y="473">2026/03/09 12:01</text><text x="545" y="473">FAS</text><text x="700" y="473">全自动运行信息</text>
    <rect x="292" y="486" width="566" height="38" fill="#ffffff" stroke="#e2e8f0"/><text x="310" y="511">03</text><text x="380" y="511">2026/03/09 12:02</text><text x="545" y="511">MACHINE.DAT.OK</text><text x="700" y="511">状态更新</text>
    <rect x="292" y="524" width="566" height="38" fill="#f8fafc" stroke="#e2e8f0"/><text x="310" y="549">04</text><text x="380" y="549">2026/03/09 12:03</text><text x="545" y="549">FAS</text><text x="700" y="549">操作完成</text>
    <rect x="292" y="562" width="566" height="38" fill="#ffffff" stroke="#e2e8f0"/><text x="310" y="587">05</text><text x="380" y="587">2026/03/09 12:04</text><text x="545" y="587">MACHINE.DAT.OK</text><text x="700" y="587">日志记录</text>
  </g>

  <!-- right detail -->
  <rect x="900" y="258" width="240" height="630" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="922" y="292" font-size="18" font-family="Microsoft YaHei, sans-serif" font-weight="700" fill="#334155">右侧详情 / 查询区</text>
  <rect x="920" y="316" width="200" height="112" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="940" y="346" font-size="15" font-family="Microsoft YaHei, sans-serif" fill="#334155">事件数据</text>
  <text x="940" y="374" font-size="13" font-family="Microsoft YaHei, sans-serif" fill="#64748b">只读详情面板</text>
  <rect x="980" y="452" width="84" height="48" rx="7" fill="#2563eb"/><text x="1022" y="482" text-anchor="middle" font-size="15" font-family="Microsoft YaHei, sans-serif" fill="#ffffff">查询</text>
  <rect x="920" y="530" width="200" height="42" rx="6" fill="#ffffff" stroke="#94a3b8"/><text x="1020" y="557" text-anchor="middle" font-size="14" font-family="Microsoft YaHei, sans-serif" fill="#475569">向上查找 / 向下查找</text>
  <rect x="980" y="600" width="84" height="48" rx="7" fill="#fee2e2" stroke="#dc2626"/><text x="1022" y="630" text-anchor="middle" font-size="15" font-family="Microsoft YaHei, sans-serif" fill="#991b1b">删除</text>

  <!-- bottom operations -->
  <rect x="60" y="914" width="1080" height="166" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="80" y="944" font-size="18" font-family="Microsoft YaHei, sans-serif" font-weight="700" fill="#3730a3">底部导航与保存操作区</text>
  <g font-family="Microsoft YaHei, sans-serif" font-size="14">
    <rect x="80" y="964" width="150" height="48" rx="7" fill="#ffffff" stroke="#64748b"/><text x="155" y="994" text-anchor="middle" fill="#334155">顶部 / 底部</text>
    <rect x="245" y="964" width="150" height="48" rx="7" fill="#ffffff" stroke="#64748b"/><text x="320" y="994" text-anchor="middle" fill="#334155">上一条 / 下一条</text>
    <rect x="410" y="964" width="150" height="48" rx="7" fill="#ffffff" stroke="#64748b"/><text x="485" y="994" text-anchor="middle" fill="#334155">向上 / 向下滚动</text>
    <rect x="575" y="964" width="150" height="48" rx="7" fill="#ffffff" stroke="#64748b"/><text x="650" y="994" text-anchor="middle" fill="#334155">标记设置</text>
    <rect x="740" y="964" width="150" height="48" rx="7" fill="#ffffff" stroke="#64748b"/><text x="815" y="994" text-anchor="middle" fill="#334155">按日期保存</text>
    <rect x="905" y="964" width="150" height="48" rx="7" fill="#2563eb"/><text x="980" y="994" text-anchor="middle" fill="#ffffff">全部保存</text>
  </g>

  <!-- annotation panel -->
  <rect x="1200" y="120" width="560" height="980" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1230" y="165" font-size="24" font-family="Microsoft YaHei, sans-serif" font-weight="700" fill="#172033">设计指定</text>
  <text x="1230" y="198" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#64748b">先看页面区域，再选择语义组件</text>
  <g font-family="Microsoft YaHei, sans-serif">
    <rect x="1230" y="230" width="500" height="130" rx="10" fill="#fff7ed" stroke="#fb923c"/>
    <text x="1250" y="260" font-size="18" font-weight="700" fill="#9a3412">① 顶部设备 / 安全区</text>
    <text x="1250" y="290" font-size="15" fill="#7c2d12">急停、报警解除属于安全/设备业务控件</text>
    <text x="1250" y="318" font-size="15" fill="#7c2d12">不要套用普通页面操作按钮</text>
    <text x="1250" y="344" font-size="14" fill="#9a3412">组件登记：待绑定真实框架控件</text>

    <rect x="1230" y="382" width="500" height="130" rx="10" fill="#eff6ff" stroke="#60a5fa"/>
    <text x="1250" y="412" font-size="18" font-weight="700" fill="#1d4ed8">② 左侧 / 中央内容区</text>
    <text x="1250" y="442" font-size="15" fill="#1e3a8a">主日志、报警日志：导航/页签</text>
    <text x="1250" y="470" font-size="15" fill="#1e3a8a">全部、模块列表：选择器/列表</text>
    <text x="1250" y="498" font-size="14" fill="#1d4ed8">表格行：数据展示组件，不是按钮</text>

    <rect x="1230" y="534" width="500" height="130" rx="10" fill="#f0fdf4" stroke="#4ade80"/>
    <text x="1250" y="564" font-size="18" font-weight="700" fill="#166534">③ 右侧详情 / 查询区</text>
    <text x="1250" y="594" font-size="15" fill="#14532d">事件数据：只读详情面板</text>
    <text x="1250" y="622" font-size="15" fill="#14532d">查询、查找：辅助操作</text>
    <text x="1250" y="650" font-size="15" fill="#14532d">删除：危险操作，必须单独确认</text>

    <rect x="1230" y="686" width="500" height="130" rx="10" fill="#eef2ff" stroke="#818cf8"/>
    <text x="1250" y="716" font-size="18" font-weight="700" fill="#3730a3">④ 底部操作区</text>
    <text x="1250" y="746" font-size="15" fill="#312e81">翻页/滚动：导航操作组件</text>
    <text x="1250" y="774" font-size="15" fill="#312e81">标记设置/按日期保存：辅助业务操作</text>
    <text x="1250" y="802" font-size="15" fill="#312e81">全部保存：页面主要业务操作</text>

    <rect x="1230" y="838" width="500" height="190" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="1250" y="870" font-size="18" font-weight="700" fill="#334155">组件库规则</text>
    <text x="1250" y="902" font-size="15" fill="#475569">同一语义组件可以出现在多个页面区域</text>
    <text x="1250" y="930" font-size="15" fill="#475569">位置不决定组件名称，语义和状态才决定</text>
    <text x="1250" y="958" font-size="15" fill="#475569">设计师只选择组件；框架映射放在登记表</text>
    <text x="1250" y="986" font-size="14" fill="#64748b">尺寸可调范围、图标资源、状态变体另行规定</text>
  </g>
</svg>
